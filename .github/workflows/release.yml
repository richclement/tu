name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        run: go test ./...

      - name: Run go vet
        run: go vet ./...

  verify-native-binary:
    name: Verify native binary (${{ matrix.goos }})
    needs: quality
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            binary_name: tu
          - runner: macos-latest
            goos: darwin
            binary_name: tu
          - runner: windows-latest
            goos: windows
            binary_name: tu.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build native binary
        shell: bash
        run: |
          native_goarch="$(go env GOARCH)"
          env GOOS="${{ matrix.goos }}" GOARCH="$native_goarch" CGO_ENABLED=0 \
            go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "$RUNNER_TEMP/${{ matrix.binary_name }}" ./cmd/tu

      - name: Verify native binary
        shell: bash
        run: |
          go run ./tools/releaseverify \
            --binary "$RUNNER_TEMP/${{ matrix.binary_name }}" \
            --version "${GITHUB_REF_NAME}"

  build-artifacts:
    name: Build release archive (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            binary_name: tu
            archive_ext: tar.gz
          - goos: linux
            goarch: arm64
            binary_name: tu
            archive_ext: tar.gz
          - goos: darwin
            goarch: amd64
            binary_name: tu
            archive_ext: tar.gz
          - goos: darwin
            goarch: arm64
            binary_name: tu
            archive_ext: tar.gz
          - goos: windows
            goarch: amd64
            binary_name: tu.exe
            archive_ext: zip
          - goos: windows
            goarch: arm64
            binary_name: tu.exe
            archive_ext: zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release binary
        shell: bash
        run: |
          mkdir -p dist/bin
          env GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" CGO_ENABLED=0 \
            go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "dist/bin/${{ matrix.binary_name }}" ./cmd/tu

      - name: Package release archive
        id: package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset_base="tu_${version}_${{ matrix.goos }}_${{ matrix.goarch }}"
          stage_dir="$RUNNER_TEMP/$asset_base"
          mkdir -p "$stage_dir"

          cp "dist/bin/${{ matrix.binary_name }}" "$stage_dir/${{ matrix.binary_name }}"
          cp README.md LICENSE "$stage_dir/"

          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            (
              cd "$stage_dir"
              zip -q -r "$RUNNER_TEMP/$asset_base.zip" .
            )
            echo "asset_path=$RUNNER_TEMP/$asset_base.zip" >> "$GITHUB_OUTPUT"
          else
            tar -C "$stage_dir" -czf "$RUNNER_TEMP/$asset_base.tar.gz" .
            echo "asset_path=$RUNNER_TEMP/$asset_base.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.package.outputs.asset_path }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - verify-native-binary
      - build-artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: dist/release
          pattern: release-*
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          (
            cd dist/release
            shasum -a 256 * > checksums.txt
          )

      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -d '' files < <(find dist/release -type f -print0 | sort -z)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no release assets found" >&2
            exit 1
          fi

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${files[@]}" --title "${GITHUB_REF_NAME}" --generate-notes
          fi
